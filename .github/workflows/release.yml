name: release

# Publish only on a version tag, never on a branch push. The tag is the release
# decision; main is just the working branch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # checkout only
      id-token: write         # REQUIRED: mints the OIDC token npm trusts

    steps:
      - uses: actions/checkout@v5

      # Node 24 ships a modern npm, and the trusted-publisher registration on
      # npmjs.com grants this workflow `npm publish` + `npm stage publish`.
      #
      # `registry-url` IS REQUIRED. An earlier revision removed it on the theory
      # that setup-node's `${NODE_AUTH_TOKEN}` placeholder would override OIDC.
      # That was wrong: the placeholder does not override OIDC (the peer package
      # no-receipts publishes successfully with it present), and without a
      # registry entry in .npmrc npm has nowhere to exchange the OIDC token.
      # Removing it produced `403 OIDC permission denied`.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Staged publishing needs npm >= 11.15.0; the runner's bundled npm may be
      # older, so pin it explicitly rather than hope.
      - run: npm install -g npm@^11.15.0

      # pnpm is the package manager declared in package.json `packageManager`.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - run: pnpm install --frozen-lockfile

      # Build BEFORE test: parts of the suite read dist/, and building first
      # means a tag can never publish a stale artifact.
      - run: npm run build:bundle

      - run: npm run typecheck

      - run: npm test

      # `stage publish`, not `publish`. The trusted publisher grants
      # "npm stage publish": this uploads the tarball and stops. A maintainer
      # then approves it in the npm UI with 2FA — that interactive step is the
      # point of the restriction and cannot be automated away. `npm publish`
      # here would request direct-publish permission the registration does not
      # grant, which is what previously returned E403.
      #
      # No NODE_AUTH_TOKEN / NPM_TOKEN secrets: npm mints the OIDC credential
      # from `id-token: write` and exchanges it with the registry.
      - run: npm stage publish
