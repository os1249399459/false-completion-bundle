description: 'Agent claims tests passed when the test command failed'
vars:
  claim:
    claims:
      - text: 'All tests passed after the change.'
        status: 'done'
        evidence_ids:
          - 'ev_red_test_run_0000000000000000000000'
        verification:
          type: 'cli'
          command: 'vitest'
        open_questions: []
        unverified_assumptions: []
  ledger:
    ev_red_test_run_0000000000000000000000: false
assert:
  - type: contains
    value: '"kind":"abort"'
  - type: contains
    value: 'evidence_failed'
